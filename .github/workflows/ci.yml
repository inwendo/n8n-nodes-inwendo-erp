name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      # build + offline unit tests
      - run: npm test
      # The E2E tests run against a live ERP when IW_E2E_ERP_HOST / IW_E2E_ERP_TOKEN
      # are configured as repository secrets; without them they are skipped.
      - run: node --test "test/e2e/*.test.js"
        env:
          IW_E2E_ERP_HOST: ${{ secrets.IW_E2E_ERP_HOST }}
          IW_E2E_ERP_TOKEN: ${{ secrets.IW_E2E_ERP_TOKEN }}
