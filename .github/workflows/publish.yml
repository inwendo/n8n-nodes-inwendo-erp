name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run build

      - name: Verify dist files
        run: |
          test -f dist/credentials/InwendoErpApi.credentials.js
          test -f dist/nodes/InwendoErp/InwendoErp.node.js
          test -f dist/nodes/InwendoErp/InwendoErpTrigger.node.js
          test -f dist/nodes/InwendoErp/InwendoErp.node.json
          test -f dist/icons/inwendo.svg

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
