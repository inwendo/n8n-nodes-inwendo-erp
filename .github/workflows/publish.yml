name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  # npm provenance (required for n8n verified community nodes since May 2026)
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - name: Verify dist files
        run: |
          test -f dist/credentials/InwendoErpApi.credentials.js
          test -f dist/nodes/InwendoErp/InwendoErp.node.js
          test -f dist/nodes/InwendoErp/InwendoErpTrigger.node.js
          test -f dist/nodes/InwendoErp/InwendoErp.node.json
          test -f dist/icons/inwendo.png

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
