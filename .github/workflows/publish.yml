# Publishes the package to npm when a version tag is pushed (`npm run release` creates it)
# or when the workflow is started by hand.
#
# n8n requires npm provenance for verified community nodes (since May 1 2026): the package must be
# published from GitHub Actions, never from a local machine. Provenance needs `id-token: write`.
#
# One-time setup on npmjs.com (package settings → Publish access → Trusted Publishers):
# GitHub Actions, owner `inwendo`, repository `n8n-nodes-inwendo-erp`, workflow `publish.yml`.
# Fallback: a granular access token as repository secret NPM_TOKEN.

name: Publish

on:
  push:
    tags:
      - '*.*.*'
  # Manual start (Actions tab or API) publishes the version in package.json.
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint the OIDC token for trusted publishing and the provenance attestation.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm 11.5.1 or newer; Node LTS may ship an older npm.
      - run: npm install -g npm@^11.5.1

      - run: npm ci

      - run: npm test

      - name: Release
        # n8n-node release lints, builds and publishes with --provenance in CI.
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
